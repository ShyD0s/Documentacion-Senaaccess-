<html lang="en" >
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <title>SENA</title>
  <link rel="icon" type="image/png" href="Icons/logoSena.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel='stylesheet' href='style.css'>
  <style>
body {
  margin:0;
  padding:0;
}

.login-box {
  text-align: center;
  margin: 120px auto 20px;
  width: 90vw;
  max-width: 445px;
  min-width: 280px;
  height: auto;
  min-height: 400px;
  padding: 32px 16px;
  background: var(--glass-bg);
  box-sizing: border-box;
  box-shadow: 0 15px 25px rgba(0,0,0,.6);
  border: 3px solid rgba(2, 217, 20, 0.2);
  border-radius: 10px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.3s ease;
}

@media (max-width: 600px) { 
  .login-box {
    width: 98vw;
    max-width: 98vw;
    min-width: 100px;
    padding: 16px 4px;
    height: auto;
  }
}

.login-box h2 {
  margin: 0 0 30px;
  padding: 0;
  color: var(--text-color);
  text-align: center;
}

.login-box .user-box {
  position: relative;
}

.login-box .user-box input {
  width: 100%;
  padding: 10px 0;
  font-size: 16px;
  color: var(--input-text);
  margin-bottom: 30px;
  border: none;
  border-bottom: 1px solid var(--input-group-border);
  outline: none;
  background: transparent;
  transition: border-color 0.3s ease;
}

.login-box .user-box label {
  position: absolute;
  top:0;
  left: 0;
  padding: 10px 0;
  font-size: 16px;
  color: var(--input-label);
  pointer-events: none;
  transition: .5s;
}

.login-box .user-box input:focus ~ label,
.login-box .user-box input:valid ~ label {
  top: -20px;
  left: 0;
  color: var(--primary-color);
  font-size: 12px;
  font-weight: bold;
}

.login-box form a {
  position: relative;
  display: inline-block;
  padding: 10px 20px;
  color: var(--text-color);
  font-size: 16px;
  text-decoration: none;
  text-transform: uppercase;
  overflow: hidden;
  transition: .5s;
  margin-top: 40px;
  letter-spacing: 4px;
}

.login-box a:hover {
  background: #02d914; 
  color: #fff;
  border-radius: 5px;
  box-shadow: 0 0 5px #02e915,
              0 0 25px #00d812,
              0 0 50px #00eb14,
              0 0 100px #00d612;
}

.login-box a span {
  position: absolute;
  display: block;
}

.login-box a span:nth-child(1) {
  top: 0;
  left: -100%;
  width: 100%;
  height: 8px;
  background: linear-gradient(90deg, transparent, #9cff4b);
  animation: btn-anim1 5s linear infinite;
  animation: reverse btn-anim1 5s  reverse infinite;
}

.texto {
  text-align: center;
  color: var(--text-color);
}

.link {
  color: var(--primary-color);
  text-decoration: none;
  transition: 0.3s ease;
}

.link:hover {
  color: #02d914;
  text-shadow: 0 0 5px #02d914;
  text-decoration: underline;
}

.logosena {
  width: 100px;
  height: auto;
  display: block;
  margin: 0 auto;
}
</style>
</head>
<body style="font-family: 'Inter', 'Roboto', sans-serif;">

<input type="checkbox" id="themeToggle" class="theme-checkbox">

<header class="barra-superior">
  <div class="logo">
    <a href="#" style="display: flex;"><img src="Icons/logoSena.png" alt="SENA" style="height: 40px; width: auto;"></a>
    <div>
      <div style="font-size: 1.25rem; font-weight: 700; letter-spacing: 1px; line-height: 1.2; color: var(--text-color); margin-bottom: 0;">
        SENA <span class="neon-text">ACCESS</span>
      </div>
      <span class="logo-badge" style="margin-left: 0;">ADMIN PANEL</span>
    </div>
  </div>
</header>
  <label for="themeToggle" class="theme-toggle-btn"><span class="dark-icon">🌙</span><span class="light-icon" style="display:none">☀️</span></label>

<div class="fade-in-up">
<div class="glass-box p-4 mb-5 mx-auto text-center" style="max-width: 480px; margin-top: 60px; margin-bottom: 60px;">
  <img src="Icons/logoSena.png" class="logosena" alt="Logo SENA" style="width: 80px; height: auto; display: block; margin: 0 auto 1rem; filter: drop-shadow(0 0 10px rgba(2, 217, 20, 0.5));">
  <h2 style="color: var(--primary-color); font-weight: 800; margin-bottom: 0.5rem;">SENA</h2>
  <p style="color: var(--text-color); opacity: 0.7; margin-bottom: 0.5rem;">Bienvenido al CCyS</p>
  <h3 style="color: var(--text-color); font-weight: 700; margin-bottom: 1.5rem;">Recuperar contraseña</h3>
  <form>
    <div class="user-box">
      <input type="text" name="email" required="">
      <label>Correo Electrónico</label>
    </div>
    <a href="#" class="btn btn-glow d-block w-100 mt-4 text-center text-decoration-none">Enviar</a>
  </form>
  <div class="mt-4">
    <p style="color: var(--text-color); opacity: 0.7; font-size: 0.85rem;">¿No estas registrado? <a href="register.html" class="link">Registrate aqui!</a></p>
    <p style="color: var(--text-color); opacity: 0.7; font-size: 0.85rem;">Otros métodos de inicio de sesión:</p>
    <a href="#" class="btn btn-glow d-inline-block mt-2 text-decoration-none">HUELLA</a>
  </div>
</div>
</div>
<footer class="footer-end">
  <div class="footer-main">
    <div>
      <p style="font-weight: 700; margin: 0;">
        <span class="text-success">Sena</span>Access
        <span class="footer-version">v0.1.9</span>
      </p>
    </div>
    <span class="footer-divider">|</span>
    <div>
      <p style="font-size: 0.875em; opacity: 0.75; margin: 0;">
        &copy; 2025 SENA &amp; SCS. Todos los derechos reservados.
      </p>
    </div>
  </div>
  <div class="footer-links">
    <a href="#">Privacidad</a>
    <a href="#">Términos</a>
    <a href="#">Soporte</a>
  </div>
</footer>

</body>
</html>
